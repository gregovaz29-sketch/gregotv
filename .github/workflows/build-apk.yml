name: Build GregoTV APK

on:
  push:
    branches: [ main, 'mejoras/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Materialize the Gradle wrapper jar (not committed as a binary).
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Diagnostic: confirm the default IPTV lists are alive and have channels.
      # Non-blocking; results land in the build log.
      #
      # The URLs are read straight out of DefaultLists.IPTV rather than being
      # duplicated here. They drifted apart once already and the stale copy kept
      # probing three dead i.mjh.nz URLs long after they were removed from the app.
      - name: IPTV channel diagnostics
        env:
          SOURCE: app/src/main/java/com/gregotv/data/settings/SettingsRepository.kt
        run: |
          set +e
          mapfile -t lists < <(
            sed -n '/object DefaultLists/,/^}/p' "$SOURCE" | grep -oE 'https://[^"]+'
          )
          if [ "${#lists[@]}" -eq 0 ]; then
            echo "::warning::No URLs parsed from $SOURCE - has DefaultLists moved?"
            exit 0
          fi
          echo "Parsed ${#lists[@]} lists from $SOURCE"
          total=0; ok=0
          printf "%-6s %-9s %s\n" "HTTP" "CHANNELS" "URL"
          for u in "${lists[@]}"; do
            code=$(curl -s -o /tmp/list.m3u -w "%{http_code}" -A "GregoTV/1.0" --max-time 40 "$u")
            ch=$(grep -c "#EXTINF" /tmp/list.m3u 2>/dev/null || echo 0)
            total=$((total + ch))
            if [ "$ch" -gt 0 ]; then ok=$((ok + 1)); fi
            printf "%-6s %-9s %s\n" "$code" "$ch" "$u"
          done
          echo "----"
          echo "Lists with channels > 0: $ok / ${#lists[@]}"
          echo "Total channels: $total"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GregoTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GregoTV-APK
          path: dist/GregoTV.apk

      # main only. Publishing from a branch would push untested code out as
      # `latest`, and the TV's download URL always resolves to `latest`.
      # Branch builds are still downloadable from the artifact above.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GregoTV build ${{ github.run_number }}
          make_latest: true
          prerelease: false
          files: dist/GregoTV.apk
