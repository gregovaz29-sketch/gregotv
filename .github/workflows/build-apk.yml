name: Build GregoTV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Materialize the Gradle wrapper jar (not committed as a binary).
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Diagnostic: confirm the default IPTV lists are alive and have channels.
      # Non-blocking; results land in the build log.
      - name: IPTV channel diagnostics
        run: |
          set +e
          lists=(
            "https://iptv-org.github.io/iptv/countries/es.m3u"
            "https://iptv-org.github.io/iptv/languages/spa.m3u"
            "https://www.tdtchannels.com/lists/tv.m3u8"
            "https://iptv-org.github.io/iptv/countries/mx.m3u"
            "https://iptv-org.github.io/iptv/countries/ar.m3u"
            "https://iptv-org.github.io/iptv/countries/co.m3u"
            "https://iptv-org.github.io/iptv/countries/cl.m3u"
            "https://iptv-org.github.io/iptv/countries/pe.m3u"
            "https://iptv-org.github.io/iptv/countries/ve.m3u"
            "https://iptv-org.github.io/iptv/countries/ec.m3u"
            "https://iptv-org.github.io/iptv/countries/uy.m3u"
            "https://iptv-org.github.io/iptv/countries/pr.m3u"
            "https://i.mjh.nz/PlutoTV/es.m3u8"
            "https://i.mjh.nz/SamsungTVPlus/es.m3u8"
            "https://i.mjh.nz/Plex/es.m3u8"
          )
          total=0; ok=0
          printf "%-6s %-9s %s\n" "HTTP" "CHANNELS" "URL"
          for u in "${lists[@]}"; do
            code=$(curl -s -o /tmp/list.m3u -w "%{http_code}" -A "GregoTV/1.0" --max-time 40 "$u")
            ch=$(grep -c "#EXTINF" /tmp/list.m3u 2>/dev/null || echo 0)
            total=$((total + ch))
            if [ "$ch" -gt 0 ]; then ok=$((ok + 1)); fi
            printf "%-6s %-9s %s\n" "$code" "$ch" "$u"
          done
          echo "----"
          echo "Lists with channels > 0: $ok / ${#lists[@]}"
          echo "Total channels: $total"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GregoTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GregoTV-APK
          path: dist/GregoTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GregoTV build ${{ github.run_number }}
          make_latest: true
          prerelease: false
          files: dist/GregoTV.apk
