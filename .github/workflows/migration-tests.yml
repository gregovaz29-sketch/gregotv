name: Room migration tests

# Migrations are the one change that can destroy the user's favorites and
# watch progress, and they cannot be verified by compiling. This runs them
# against real SQLite on a real emulator.
#
# Separate from build-apk.yml on purpose: booting an emulator takes minutes,
# and a slow test job should not sit between a push and a downloadable APK.

on:
  push:
    branches: [ main, 'mejoras/**' ]
  workflow_dispatch:

jobs:
  migration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # The wrapper jar is generated rather than committed, same as the APK build.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Hardware acceleration; without it the emulator is unusably slow.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run migration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      # The schema JSONs Room exports. They belong in the repo so migrations
      # stay checkable, but nothing generates them locally — there is no
      # Android SDK on the dev machine — so they are published here to be
      # committed from.
      - name: Upload exported Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: warn
